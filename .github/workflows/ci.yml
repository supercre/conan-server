name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Conan
        run: python -m pip install conan==2.27.1
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +stable fmt --check
      - name: Clippy
        run: cargo +stable clippy --all-targets --locked -- -D warnings
      - name: Unit tests
        run: cargo +stable test --locked
      - name: Build
        run: cargo +stable build --locked
      - name: Native Conan round trip
        run: python tests/smoke.py
      - name: Namespaced Conan round trip
        run: python tests/smoke.py --with-channel
      - name: iOS device Conan round trip
        if: runner.os == 'macOS'
        run: python tests/smoke.py --ios-sdk iphoneos
      - name: iOS simulator Conan round trip
        if: runner.os == 'macOS'
        run: python tests/smoke.py --ios-sdk iphonesimulator
